[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idi-case-archive"
version = "0.2.53"
description = "IDI case photo archive and reporting workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "httpx>=0.28,<1",
  "pypinyin>=0.55,<1",
  "lark-oapi==1.7.5",
  "cryptography>=46,<49",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4.4,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["idi*"]

[tool.setuptools.package-data]
idi = ["migrations/*.sql", "templates/*.docx", "platform_dictionary.json", "camera_setup.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
